<html lang="tr"><head><meta charset="utf-8">

:root[data-theme="dark"]{--b1:#1c2748;--b2:#060914;--pn:rgba(16,24,46,.9);--fg:#e8eefc;--mu:#93a1c4;--ac:#5b9bff;--bd:rgba(255,255,255,.2)}

#eq{font-size:18px;font-weight:600;margin:4px 0}#eq span{transition:opacity .3s}

#lib summary{cursor:pointer;font-weight:600}

#lib select option{color:#000}
#chips{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}

button:hover{border-color:var(--ac)}button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.chip{padding:2px 7px;font-size:12px}

.row{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center}
.row label{font-size:12px;color:var(--mu);display:flex;align-items:center;gap:4px}
input[type=range]{accent-color:var(--ac)}
</style></head><body>
<canvas id="c"></canvas>
<div id="top" class="pn"><b>⚗️ 3D Tepkime Simülatörü</b><div id="eq"></div><div id="st"></div><div id="msg"></div></div>
<details id="lib" class="pn" open><summary>Tepkime &amp; Molekül Kütüphanesi</summary>
<select id="sel"></select>
<input type="text" id="inp" placeholder="Kendi tepkimen: N2 + 3H2 -> 2NH3">
<button id="mk">Tepkimeyi oluştur</button>
<div style="font-size:12px;color:var(--mu);margin-top:6px">Kütüphane (tıkla → molekülü tek başına incele):</div>
<div id="chips"></div>
<details><summary style="font-weight:400">＋ Yeni molekül ekle</summary>
<input type="text" id="nf" placeholder="Formül (ör. CH3Cl)"><input type="text" id="nn" placeholder="Ad">
<input type="text" id="ns" placeholder="C 0 0 0;Cl 1.78 0 0|0-1  (Å koordinat | bağlar: - = # ~)">

<div class="row" style="justify-content:flex-start;margin-top:6px"><label><input type="checkbox" id="lb" checked>Etiketler</label><label><input type="checkbox" id="ar">Otomatik döndür</label></div>

<canvas id="lw" width="380" height="190"></canvas>

<div class="row"><label>Hız <input type="range" id="sp" min=".2" max="3" step=".1" value="1"></label><label>İlerleme <input type="range" id="pg" min="0" max="3" step=".005" value="0" style="width:200px"></label></div>
</div>

  const ls=(mode=='space'?Math.min(1.3,EL[a.el][1]*.6):.55)*a.s;a.sp.position.copy(v);a.sp.scale.set(ls,ls,1);a.sp.visible=$('#lb').checked&&a.s>.2&&!(mode=='skel'&&(a.el=='C'||a.el=='H'))});
 const Y=new V3(0,1,0);
 S.B.forEach(b=>{const w=b.k=='r'?wr:wp,sa=Math.min(b.a.s,b.b.s),show=mode!='space'&&w>.02&&sa>.1,n=Math.max(1,b.o);
  b.ms.forEach((m,i)=>m.visible=show&&i<n);if(!show)return;
  const d=b.b.v.clone().sub(b.a.v),len=d.length(),dn=d.clone().normalize(),q=new Q().setFromUnitVectors(Y,dn),
   pr=new V3().crossVectors(dn,Math.abs(dn.z)<.9?new V3(0,0,1):new V3(1,0,0)).normalize(),
   rad=(mode=='skel'?.035:.08)*(b.o?1:.6)*(n>1?.7:1)*(.4+.6*w)*sa;
  for(let i=0;i<n;i++){const m=b.ms[i];m.position.copy(b.a.v).addScaledVector(d,.5).addScaledVector(pr,(i-(n-1)/2)*.2);m.quaternion.copy(q);m.scale.set(rad,len,rad);
   m.material.color.copy(b.o?GRC:ION).lerp(ORC,1-w);m.material.opacity=b.o?w:w*.55}});
 S.halo.visible=bell>.02;S.halo.material.opacity=.13*bell}
/* ---------- LEWIS PANELİ ---------- */
function lewis(side){const c=$('#lw'),g=c.getContext('2d'),W=c.width,H=c.height,fg=getComputedStyle(document.body).color,mu=getComputedStyle(document.documentElement).getPropertyValue('--mu');
 g.clearRect(0,0,W,H);g.fillStyle=mu;g.font='12px system-ui';g.textAlign='left';g.fillText((side=='r'?'Girenler':'Ürünler')+' — Lewis (çizgi: ortaklanmış çift, • •: ortaklanmamış çift)',8,16);
 const list=S.rx[side],cw=W/list.length;
 list.forEach((sp,idx)=>{const mol=LIB[sp.f],cx=cw*idx+cw/2,cy=H/2+10;
  const vr=[0,1,2].map(i=>mol.atoms.reduce((s,a)=>s+a[i+1]**2,0)),dr=vr.indexOf(Math.min(...vr)),kp=[0,1,2].filter(i=>i!=dr);
  const pt=mol.atoms.map(a=>[a[kp[0]+1],a[kp[1]+1]]),sx=Math.max(...pt.map(x=>x[0]))-Math.min(...pt.map(x=>x[0])),sy=Math.max(...pt.map(x=>x[1]))-Math.min(...pt.map(x=>x[1]));
  const k=Math.min(40,(cw-60)/Math.max(sx,.5),(H-80)/Math.max(sy,.5)),P=pt.map(x=>[cx+x[0]*k,cy-x[1]*k]);
  g.strokeStyle=fg;g.fillStyle=fg;g.lineWidth=1.6;
  mol.bonds.forEach(([i,j,o])=>{const dx=P[j][0]-P[i][0],dy=P[j][1]-P[i][1],L=Math.hypot(dx,dy)||1,ux=dx/L,uy=dy/L,x1=P[i][0]+ux*11,y1=P[i][1]+uy*11,x2=P[j][0]-ux*11,y2=P[j][1]-uy*11;
   if(L<24)return;g.setLineDash(o?[]:[3,3]);const n=Math.max(1,o);
   for(let t=0;t<n;t++){const f=(t-(n-1)/2)*4;g.beginPath();g.moveTo(x1-uy*f,y1+ux*f);g.lineTo(x2-uy*f,y2+ux*f);g.stroke()}g.setLineDash([])});
  g.font='bold 15px system-ui';g.textAlign='center';g.textBaseline='middle';
  mol.atoms.forEach((a,i)=>{const[x,y]=P[i];g.fillText(a[0],x,y);
   let bs=0,vx=0,vy=0;mol.bonds.forEach(([u,w,o])=>{if(u!=i&&w!=i)return;const t=u==i?w:u;bs+=o;if(o){const dx=P[t][0]-x,dy=P[t][1]-y,L=Math.hypot(dx,dy)||1;vx+=dx/L;vy+=dy/L}});
   const val=EL[a[0]][3],e=val?Math.max(0,val-bs):0,Lp=e>>1,base=Math.hypot(vx,vy)>.2?Math.atan2(-vy,-vx):-Math.PI/2;
   const offs=Lp==1?[0]:Lp==2?[-.7,.7]:Lp==3?[-1.4,0,1.4]:[0,1.57,3.14,4.71];
   offs.slice(0,Lp).forEach(o=>{const an=base+o,qx=x+Math.cos(an)*17,qy=y+Math.sin(an)*17;[-3,3].forEach(s=>{g.beginPath();g.arc(qx-Math.sin(an)*s,qy+Math.cos(an)*s,2,0,7);g.fill()})});
   if(e&1){g.beginPath();g.arc(x+Math.cos(base+2.4)*17,y+Math.sin(base+2.4)*17,2,0,7);g.fill()}});
  g.font='12px system-ui';g.fillStyle=mu;g.fillText((sp.n>1?sp.n+'× ':'')+sp.f,cx,H-12);g.fillStyle=fg;
  if(idx){g.font='bold 20px system-ui';g.fillText('+',cw*idx,cy)}})}
